server {
    listen 80;
    server_name _;

    # P2-B2：对齐网关 50m + 后端 file_max_size 默认 50MB（链路唯一缺限的一环，缺则默认 1MB 上传 413）。
    # 注：后端 file_max_size 可热改调大，需同步此处。
    client_max_body_size 50m;

    # P2-C4：SPA 补 CSP。script-src 不含 unsafe-inline/unsafe-eval/外域 → 任何 XSS 都无法执行内联 handler
    # 或外挂脚本 → localStorage 的 access/refresh token 不可被窃取（纵深防御）。
    # style-src 保留 unsafe-inline：ECharts/Element Plus 运行时设 style 属性，缺会破样式。
    # frame-ancestors none：内网系统无 iframe 嵌入需求（与 X-Frame-Options 同理）。
    # 注意：下方静态资源 location 自带 add_header，不继承本 server 级 header，需重复同条 CSP。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;

    root /usr/share/nginx/html;
    index index.html;

    # 前端路由（history 模式）回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理到统一网关（api-gateway:8099）：网关按 Host 头路由到 ai-eval 后端
    # （同源，避免 CORS 与 httpOnly cookie 跨域问题）
    location /api/ {
        proxy_pass http://api-gateway:8099;
        proxy_set_header Host eval.local;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # P2-D15：对齐 api-gateway 300s 读超时。慢 SSE 评测链路（如 sp chat+score 串行探测
        # 或长推理）默认 60s 会被切断返回 504，必须放行到网关同级别。
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /healthz {
        proxy_pass http://api-gateway:8099;
        proxy_set_header Host eval.local;
    }

    # 静态资源缓存（自带 add_header → 不继承 server 级 CSP，此处重复；Cache-Control 见下）
    location ~* \.(js|css|png|jpg|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
        try_files $uri =404;
    }
}
