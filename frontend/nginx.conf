server {
    listen 80;
    server_name _;

    # P2-B2：对齐网关 50m + 后端 file_max_size 默认 50MB（链路唯一缺限的一环，缺则默认 1MB 上传 413）。
    # 注：后端 file_max_size 可热改调大，需同步此处。
    client_max_body_size 50m;

    root /usr/share/nginx/html;
    index index.html;

    # 前端路由（history 模式）回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理到统一网关（api-gateway:8099）：网关按 Host 头路由到 ai-eval 后端
    # （同源，避免 CORS 与 httpOnly cookie 跨域问题）
    location /api/ {
        proxy_pass http://api-gateway:8099;
        proxy_set_header Host eval.local;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /healthz {
        proxy_pass http://api-gateway:8099;
        proxy_set_header Host eval.local;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
