# ============================================================
# agent-evaluation-offline — 共享 infra 模式（全共享方案，2026-08-25 起）
#
# 本 agent 不自带任何中间件，仅依赖共享 infra 的 MySQL：
#   mysql -> infra MySQL（库 ai_evaluation / 账号 evaluation）
#   （aeo 无 Redis / Milvus 依赖）
#
# 前置：先部署共享 infra（D:/study/aiprojcet/infra，`docker compose up -d`）。
# 启动：docker compose up -d --build
# 连接：前端 http://localhost:8180 / 后端 http://localhost:8100
#
# 表结构：aeo 用 alembic 管理（手动/脚本执行），迁移数据已含表 + alembic_version，
#   应用启动不自动跑 alembic，无需改建表逻辑。
# 开发热挂载 ./backend:/app 保留（改代码 restart 生效）；extra_hosts 保留（评测需访问宿主机 agent）。
# ============================================================

name: agent-evaluation-offline

services:
  backend:
    build: ./backend
    container_name: ai-eval-backend
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: ${DB_USER:-evaluation}
      DB_NAME: ${DB_NAME:-ai_evaluation}
      DB_PASSWORD: ${DB_PASSWORD:?db_password 必须设置}
      JWT_SECRET: ${JWT_SECRET:?jwt_secret 必须设置（≥256bit）}
      FERNET_KEYS: ${FERNET_KEYS:?fernet_keys 必须设置（逗号分隔多代）}
      JUDGE_API_KEY: ${JUDGE_API_KEY:-}
      # 空库重建 admin 初始密码（seed 优先取此值；首登仍强制改密）
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "${APP_HOST_PORT:-8100}:8000"
    # 7.6 C5 多 worker：默认 1 保持现状；置 BACKEND_WORKERS=2 可验证多 worker 互斥
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${BACKEND_WORKERS:-1}
    extra_hosts:
      # 宿主机 agent 访问（Linux host-gateway；Windows/Mac Docker Desktop 原生支持）
      - "host.docker.internal:host-gateway"
    volumes:
      # 开发期热挂载：改代码后 restart 即生效（无需 rebuild）
      - ./backend:/app
      # 文件型用例自存文件（决策 #12）：宿主 ./uploads ↔ 容器 /app/uploads
      - ./uploads:/app/uploads
    restart: unless-stopped
    networks:
      - shared-infra

  frontend:
    build: ./frontend
    container_name: ai-eval-frontend
    ports:
      - "${FRONT_HOST_PORT:-8180}:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - shared-infra

networks:
  shared-infra:
    external: true
    name: shared-infra_shared-infra
