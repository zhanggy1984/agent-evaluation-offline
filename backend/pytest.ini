[pytest]
# 7.2 容器集成测试：全局 async engine 连接池必须绑定单一 event loop，
# 否则 pytest-asyncio 默认 function 级 loop 下跨测试复用连接报 "Event loop is closed"。
# session 级 loop 让 integration 目录全部 async 测试共享一个 loop。
# 宿主全量跑时 PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 不加载 pytest-asyncio，这些
# asyncio_* 选项视为未知 → 用 filterwarnings 忽略该提示（不影响测试结果）。
asyncio_default_test_loop_scope = session
asyncio_default_fixture_loop_scope = session
filterwarnings =
    ignore::pytest.PytestConfigWarning
# 警示：session loop 下全局 async engine 连接池跨测试复用。新增 async 测试必须
# 自管 session/事务（每测试独立 SessionLocal + commit），严禁跨测试共享连接，
# 否则一个测试的事务状态会泄漏污染后续测试。
